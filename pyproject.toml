[project]
name = "ssannssarr.zuni"
version = "0.1.0"
description = "A terminal research assistant with web search and cited answers."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "ssannssarr", email = "ssantanusarkar8@gmail.com" }
]
keywords = ["cli", "ai", "llm", "research", "web-search", "terminal"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Utilities",
]
dependencies = [
    "asyncclick>=8.4.2.1",
    "bs4>=0.0.2",
    "curl-cffi>=0.16.3",
    "httpx>=0.28.1",
    "rich>=15.0.0",
    "markdownify>=1.0.0",
]

[project.scripts]
zuni = "zuni.cli:main"

[project.urls]
Homepage = "https://ssannssarr.github.io/Zuni/"
Repository = "https://github.com/ssannssarr/Zuni"
Documentation = "https://ssannssarr.github.io/Zuni/"
Issues = "https://github.com/ssannssarr/Zuni/issues"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "zuni"

[dependency-groups]
dev = [
    "mkdocs-material>=9.7.7",
]

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
