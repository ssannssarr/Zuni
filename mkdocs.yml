site_name: Zuni
site_description: One Command Search
site_url: https://ssannssarr.github.io/Zuni/

repo_name: ssannssarr/Zuni
repo_url: https://github.com/ssannssarr/Zuni

theme:
  name: material
  font:
    text: Space Grotesk
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
  palette:
    scheme: slate
    primary: black
    accent: lime

  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - content.code.copy
    - content.code.annotate
    - navigation.footer

extra_css:
  - stylesheets/home.css

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Configuration: getting-started/configuration.md
  - Guide:
      - Commands: guide/commands.md
      - Architecture: guide/architecture.md
      - Troubleshooting: guide/troubleshooting.md
  - Development:
      - Project Structure: development/project-structure.md
      - Contributing: development/contributing.md
  - Roadmap: roadmap.md
  - FAQ: faq.md

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/ssannssarr/Zuni
    - icon: fontawesome/solid/paper-plane
      link: mailto:ssannssarrai@gmail.com
    - icon: fontawesome/brands/instagram
      link: https://instagram.com/ssannssarrai
